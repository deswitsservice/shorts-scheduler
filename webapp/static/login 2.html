<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · Shorts Scheduler</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(140deg,#fff0f4,#edf5ff);font:16px system-ui;color:#14214a}main{box-sizing:border-box;width:min(430px,94vw);padding:32px;background:white;border-radius:20px;box-shadow:0 16px 70px #24428218}h1{font-size:25px}label{display:block;margin:18px 0 6px}input,button{box-sizing:border-box;width:100%;padding:12px;border:1px solid #cad3e5;border-radius:8px;font:inherit}button{margin-top:18px;background:#345bff;color:white;cursor:pointer}button.secondary{background:white;color:#345bff}p{line-height:1.5}#error{color:#a71938}small{color:#546482}</style></head>
<body><main><h1>♥ Shorts Scheduler</h1><p id="intro">Sign in to your private workspace.</p><form id="auth"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required maxlength="254"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required minlength="8" maxlength="128"><small>Use at least 8 characters.</small><p id="error" role="alert"></p><button id="submit">Sign in</button></form><button class="secondary" id="toggle" type="button">Create an account</button></main>
<script>
let register=false;
const form=document.getElementById('auth'), error=document.getElementById('error'), submit=document.getElementById('submit'), toggle=document.getElementById('toggle');
toggle.onclick=()=>{register=!register;submit.textContent=register?'Create account':'Sign in';toggle.textContent=register?'Already have an account? Sign in':'Create an account';document.getElementById('password').autocomplete=register?'new-password':'current-password';error.textContent='';};
form.onsubmit=async event=>{event.preventDefault();submit.disabled=true;error.textContent='';try{const response=await fetch('/api/auth/'+(register?'register':'login'),{method:'POST',headers:{'Content-Type':'application/json','X-Shorts-Request':'1'},body:JSON.stringify({email:document.getElementById('email').value,password:document.getElementById('password').value})});const data=await response.json();if(!response.ok)throw Error(data.error||'Unable to sign in.');location.replace(new URLSearchParams(location.search).get('intent') === 'upload' ? '/#videoCard' : '/');}catch(e){error.textContent=e.message;}finally{submit.disabled=false;}};
</script></body></html>
